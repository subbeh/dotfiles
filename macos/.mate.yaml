targets:
  etc: /etc

hooks:
  battery-sleep:
    match: Library/LaunchAgents/macos.battery-sleep.plist
    description: Reload the battery sleep LaunchAgent
    do:
      - run: launchctl bootout "gui/$(id -u)/macos.battery-sleep" 2>/dev/null; launchctl bootstrap "gui/$(id -u)" ~/Library/LaunchAgents/macos.battery-sleep.plist

packages:
  brew:
    # apps
    - alt-tab
    - clintmod/formulas/macprefs
    - dimentium/autoraise/autoraise
    - google-chrome
    - karabiner-elements
    - logi-options+
    - mackup
    - middleclick
    - mole
    - raycast
    # - rectangle
    - spotify
    - vlc
    # fonts
    - font-fira-code-nerd-font
    - font-fira-mono-nerd-font
    - font-hack-nerd-font
    - sf-symbols
