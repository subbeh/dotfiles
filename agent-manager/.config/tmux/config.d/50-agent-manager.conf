# vi: ft=tmux
###########################################################################

# tmux-tpad

set -g @tpad-agentmgr-bind        "C-c"
set -g @tpad-agentmgr-style       "fg=colour2"
set -g @tpad-agentmgr-height      "85%"
set -g @tpad-agentmgr-width       "85%"
set -g @tpad-agentmgr-cmd         'tmux split-window -v -d -l 5 -t "$TMUX_PANE" -c "$PWD" && exec agent-manager'
set -g @tpad-agentmgr-opts        "status on"
