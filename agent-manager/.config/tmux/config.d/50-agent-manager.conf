# vi: ft=tmux
###########################################################################

# tmux-tpad

set -g @tpad-agentmgr-bind        "C-c"
set -g @tpad-agentmgr-style       "fg=colour2"
set -g @tpad-agentmgr-height      "80%"
set -g @tpad-agentmgr-width       "80%"
# set -g @tpad-agentmgr-cmd         'tmux split-window -h -d -l 20% -t "$TMUX_PANE" -c "$PWD" && tmux split-window -v -d -l 20% -t "$TMUX_PANE" -c "$PWD" && exec agent-manager'
set -g @tpad-agentmgr-cmd         'tmux split-window -v -d -l 15% -t "$TMUX_PANE" -c "$PWD" && exec agent-manager'
set -g @tpad-agentmgr-shell       "true"
set -g @tpad-agentmgr-opts        "status on"
