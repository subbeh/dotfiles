# Auto-assign apps to workspaces
[[on-window-detected]]
if.app-name-regex-substring = 'Termius'
run = 'move-node-to-workspace G'

[[on-window-detected]]
if.app-name-regex-substring = 'Kitty'
run = 'move-node-to-workspace 2'

# Auto-float apps
[[on-window-detected]]
if.app-name-regex-substring = 'System Preferences'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Activity Monitor'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '1Password'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Raycast'
run = 'layout floating'
