targets:
  workspace: "{{ .Vars.workspaceDir }}"

include:
  - workspace/home-ops/.bws.yaml

# Hooks only see deployed files, so this hash of the synced values is what
# triggers the bws-sync hook below when one changes in the vault.
{{- $values := dict }}
{{- range $key, $ref := .Vars.bws.secrets }}
{{- $_ := set $values $key (bitwarden (index $ref 0) (index $ref 1) (index $ref 2)) }}
{{- end }}
generate:
  - target: {{ .Vars.workspaceDir }}/.cache/bws-sync/secrets.sha256
    mode: "0600"
    content: "{{ $values | toJson | sha256sum }}"

hooks:
  bws-sync:
    match:
      - {{ .Vars.workspaceDir }}/home-ops/.bws.yaml
      - {{ .Vars.workspaceDir }}/.cache/bws-sync/secrets.sha256
    description: Sync home-ops secrets to Bitwarden Secrets Manager
    do:
      - script: bws-sync.sh
