---
# Vault values synced to Bitwarden Secrets Manager for home-ops, by
# home-ops/.matescripts/70-bws-sync.sh. Each key is the Secrets Manager key
# (UPPER_SNAKE, so it doubles as an env var name); each value is the arguments
# to the `bitwarden` template function: [item, type, field].
variables:
  bws:
    secrets:
      ATUIN_OPENAI_API_KEY: [openai.com, field, atuin-api-key]
      CLOUDFLARE_API_TOKEN: [cloudflare.com, field, sbbh-cloud-dns-api-token]
      GATUS_EXTERNAL_TOKEN: [gatus.int.sbbh.cloud, field, external-token]
      GATUS_PUSHOVER_APP_TOKEN: [pushover.net, field, api-token-gatus]
      GATUS_PUSHOVER_USER_KEY: [pushover.net, field, user-key]
      HERMES_DASHBOARD_PASSWORD: [hermes.vps.sbbh.cloud, login, password]
      HERMES_DASHBOARD_SECRET: [hermes.vps.sbbh.cloud, field, dashboard-secret]
      HERMES_ANTHROPIC_API_KEY: [claude.com, field, hermes-token]
      HERMES_TELEGRAM_BOT_TOKEN: [telegram.org, field, sbbh-cloud-bot-token]
      HERMES_TELEGRAM_ALLOWED_USERS: [telegram.org, login, username]
      KARAKEEP_MEILI_MASTER_KEY: [karakeep.vps.sbbh.cloud, field, meili-master-key]
      KARAKEEP_NEXTAUTH_SECRET: [karakeep.vps.sbbh.cloud, field, nextauth-secret]
      KARAKEEP_OPENAI_API_KEY: [openai.com, field, karakeep-api-key]
      OPNSENSE_API_KEY: [opnsense.sbbh.cloud, field, admin-api-key]
      OPNSENSE_API_SECRET: [opnsense.sbbh.cloud, field, admin-api-secret]
      RESTIC_VPS_PASSWORD: [restic, login, password]
      RESTIC_VPS_SSH_KEY: [restic-ssh-key-vps, ssh, private]
      RESTIC_VPS_SSH_USER: [hetzner.com, field, storage-box-vps-user]
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: [semaphore.vps.sbbh.cloud, field, access-key-encryption]
      SEMAPHORE_ADMIN_PASSWORD: [semaphore.vps.sbbh.cloud, login, password]
      SEMAPHORE_API_TOKEN: [semaphore.vps.sbbh.cloud, field, gh-runner-api-token]
      SEMAPHORE_BWS_ACCESS_TOKEN: [bitwarden.com, field, home-ops-bws-semaphore-token]
      TAILSCALE_TERRAFORM_OAUTH_CLIENT_ID: [tailscale.com, field, terraform-oauth-client-id]
      TAILSCALE_TERRAFORM_OAUTH_CLIENT_SECRET: [tailscale.com, field, terraform-oauth-client-secret]
      TFC_API_TOKEN: [terraform.io, field, user-token]
