# Statemate configuration
# See: https://github.com/subbeh/statemate

# Default target for deployed files (default: $HOME)
target_base: "~"

aur_helper: paru
diff_tool: mate-diff

include:
  - .mate/theme.yaml
variables:
  configHome: "~/.config"
  authorizedSshKeys:
    - laptop-personal-ssh-key
    - laptop-work-ssh-key
  gpgKeys:
    - D70DB41617DF61F1

age:
  identity: "~/.config/statemate/key.txt"
  recipients:
    - age14lue9m7wkjynpke4290yjnk36ztm6fdvj65dhudprc4rj8yajgxqxawmnf

ignore:
  - INSTALL.md
  - .gitkeep

sources:
  - core
  - agent-manager
  - atuin
  - bitwarden
  - claude
  - eza
  - fd
  - fzf
  - git
  - gnupg
  - infra
  - k9s
  - kitty
  - nvim
  - ripgrep
  - ssh
  - tailscale
  - television
  - starship
  - statemate
  - syncthing
  - task
  - tmux
  - vifm
  - zsh

# Profiles for machine-specific configuration
profiles:
  linux:
    detection:
      os: linux
  macos:
    detection:
      os: darwin
    sources:
      - sofka
    variables:
      workspaceDir: "/Users/Shared/data/workspace"
      configHome: "~/Library/Application Support"
  personal:
    extends: linux
    detection:
      command: "test -f /etc/arch-release"
    sources:
      - arch
      - hyprland
      - mpv
      - restic
      - firefox
    variables:
      workspaceDir: "/data/workspace"
      firefoxDir: "/data/appdata/firefox"
      sshKeys:
        - laptop-personal-ssh-key
        - github-ssh-key
        - home-ops-ssh-key
        - aur-ssh-key
  work:
    extends: macos
    detection:
      user: steven.terwindt
    sources:
      - macos
      - work
    variables:
      sshKeys:
        - laptop-work-ssh-key
        - github-ssh-key
        - home-ops-ssh-key

hooks:
  systemd-reload:
    profile: linux
    match:
      - "/etc/systemd/**/*.service"
      - "/etc/systemd/**/*.timer"
    do:
      - run: sudo systemctl daemon-reload
  systemd-user-reload:
    profile: linux
    match:
      - ".config/systemd/user/**"
      - ".config/environment.d/*.conf"
    do:
      - run: systemctl --user daemon-reload
      - run: pkill -u "$USER" zsh --signal=USR2 || true
  tmux-reload:
    match:
      - ".config/tmux/**"
    do:
      - run: tmux-reset
