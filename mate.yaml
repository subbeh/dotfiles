# Statemate configuration
# See: https://github.com/subbeh/statemate

# Default target for deployed files (default: $HOME)
target_base: "~"

aur_helper: paru

include:
  - .mate/theme.yaml
variables:
  authorizedSshKeys:
    - laptop-personal-ssh-key
    - laptop-work-ssh-key
  gpgKeys:
    - D70DB41617DF61F1

age:
  identity: "~/.config/statemate/key.txt"
  recipients:
    - age14lue9m7wkjynpke4290yjnk36ztm6fdvj65dhudprc4rj8yajgxqxawmnf

ignore:
  - INSTALL.md

sources:
  - core
  - atuin
  - bitwarden
  - claude
  - eza
  - fd
  - fzf
  - git
  - gnupg
  - k9s
  - kitty
  - nvim
  - ripgrep
  - ssh
  - tailscale
  - starship
  - statemate
  - task
  - tmux
  - vifm
  - zsh

# Profiles for machine-specific configuration
profiles:
  linux:
    detection:
      os: linux
  macos:
    detection:
      os: darwin
    variables:
      workspaceDir: "/Users/Shared/data/workspace"
  personal:
    extends: linux
    detection:
      command: "test -f /etc/arch-release"
    sources:
      - arch
      - hyprland
      - mpv
      - restic
      - firefox
      - syncthing
    variables:
      workspaceDir: "/data/workspace"
      firefoxDir: "/data/appdata/firefox"
      sshKeys:
        - laptop-personal-ssh-key
        - github-ssh-key
        - home-ops-ssh-key
        - aur-ssh-key
  work:
    extends: macos
    detection:
      user: steven.terwindt
    sources:
      - macos
      - work
    variables:
      sshKeys:
        - laptop-work-ssh-key
        - github-ssh-key
        - home-ops-ssh-key
