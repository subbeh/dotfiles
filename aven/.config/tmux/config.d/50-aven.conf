# vi: ft=tmux
###########################################################################

# tmux-tpad

set -g @tpad-aven-bind        "C-t"
set -g @tpad-aven-style       "fg=colour13"
set -g @tpad-aven-height      "90%"
set -g @tpad-aven-width       "90%"
set -g @tpad-aven-cmd         "aven"

# tmux-fingers
set -g @fingers-pattern-2 '[A-Z]{2,3}-[A-Z0-9]{4}'
set -g @fingers-pattern-3 'C[OA]-[0-9]*'
