# vi: ft=tmux
###########################################################################

# tmux outlives a Hyprland restart, so re-point the global env at the newest instance on every (re)load
run-shell '. ~/.config/profile.d/30-hyprland.sh; [ -n "$HYPRLAND_INSTANCE_SIGNATURE" ] && tmux set-environment -g HYPRLAND_INSTANCE_SIGNATURE "$HYPRLAND_INSTANCE_SIGNATURE"'
