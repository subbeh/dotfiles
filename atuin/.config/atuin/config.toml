sync_address = "https://atuin.vps.sbbh.cloud"
filter_mode = "workspace"
workspaces = true
enter_accept = false
network_timeout = 5
search_mode = "daemon-fuzzy"

[tmux]
enabled = true
width = "80%"
height = "80%"

[stats]
common_subcommands = [
  "brew",
  "git",
  "go",
  "hermes",
  "ip",
  "kubectl",
  "nmcli",
  "pacman",
  "paru",
  "systemctl",
  "tmux",
  "yay",
]
ignored_commands = ["cd", "ls", "ll", "vi", "z"]

[sync]
records = true

[daemon]
enabled = true
autostart = true

[ai]
enabled = true
endpoint = "https://atuin-ai.vps.sbbh.cloud"

[ai.opening]
send_last_command = true

[pty_proxy]
enabled = false
