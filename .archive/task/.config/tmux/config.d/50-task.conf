# vi: ft=tmux
###########################################################################

# tmux-tpad

set -g @tpad-task-bind          "C-w"
set -g @tpad-task-style         "fg=colour13"
set -g @tpad-task-height        "40%"
set -g @tpad-task-width         "40%"
set -g @tpad-task-cmd           "taskwarrior-tui"
