# vi: ft=tmux
###########################################################################
# workmux

bind -N "Toggle workmux sidebar" W run-shell "workmux sidebar --session"
bind -N "Jump to last done agent" g run-shell "workmux last-done"
bind -N "Toggle last agent" Tab run-shell "workmux last-agent"

# set -g @tpad-workmux-bind       "C-w"
# set -g @tpad-workmux-style      "fg=colour2"
# set -g @tpad-workmux-height     "80%"
# set -g @tpad-workmux-width      "80%"
# set -g @tpad-workmux-cmd        "workmux dashboard"

# Dashboard: a native popup rather than a tpad instance.
#
# tpad opens a popup by attaching a real session to it, so anything running
# inside sees that session as the current one. The dashboard opens worktree
# windows in the current session, which meant Enter put them inside
# tpad_workmux instead of home/work. `display-popup` draws over the current
# client without a session of its own, so the dashboard sees the parent session
# and opens windows there. The dashboard keeps no state worth persisting
# between invocations, so tpad buys it nothing.
# `-d` is required, not cosmetic: a popup command otherwise starts in $HOME,
# which is not a repo, so the Worktrees tab would have no project to list.
# Workmux keeps no project registry — it discovers projects from live agent
# panes and from the current directory — so the dashboard only sees a dormant
# worktree when opened from a pane inside that repo.
bind -N "workmux dashboard" C-w display-popup -E \
  -d "#{pane_current_path}" \
  -w 80% -h 80% -b rounded -S fg=colour2 \
  -T "#[fg=colour2,bold] workmux " \
  "workmux dashboard"
