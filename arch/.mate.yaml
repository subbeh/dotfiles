targets:
  etc: /etc
  root: /root

hooks:
  systemd-reload:
    profile: linux
    match:
      - "/etc/systemd/**/*.service"
      - "/etc/systemd/**/*.timer"
    do:
      - run: sudo systemctl daemon-reload
  systemd-user-reload:
    profile: linux
    match:
      - ".config/systemd/user/**"
      - ".config/environment.d/*.conf"
    do:
      - run: systemctl --user daemon-reload
  initramfs:
    match: /etc/crypttab
    do:
      - run: sudo mkinitcpio -P

packages:
  pacman:
    # core
    - base
    - base-devel
    - bc
    - btrfs-progs
    - dosfstools
    - efibootmgr
    - fprintd
    - grub
    - intel-ucode
    - libfido2
    - linux
    - linux-firmware
    - linux-headers
    - linux-lts
    - linux-lts-headers
    - os-prober
    - pacman-contrib
    - sbctl
    - snap-pac
    - snapper
    - systemd-ukify
    - tlp
    - zram-generator
    # apps
    - chromium
    - spotify-launcher
    # network
    - bind
    - dhcpcd
    - networkmanager
    - nm-connection-editor
    - proton-vpn-cli
    # tools
    - keyd
    - reflector
    # misc
    - fwupd
    # sound
    - pavucontrol
    - pipewire
    - pipewire-pulse
    - sof-firmware
    - wireplumber
    # bluetooth
    - bluez
    - bluez-utils
  aur:
    - paru
    - pam-fprint-grosshack
