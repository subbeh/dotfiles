# Pebble V3 accepts Bluetooth absolute volume but ignores it, so volume only changed at 0% (mute)
monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.00_02_3C_D6_55_D7" }
    ]
    actions = {
      update-props = {
        bluez5.hw-volume = [ hfp_ag hsp_ag ]
      }
    }
  }
]
